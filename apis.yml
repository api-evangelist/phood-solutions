name: Phood Solutions
description: Phood Solutions is a New York City-based food-waste technology company founded in
  2015 by Luc Dang and Nick Kruczek. Its computer-vision platform, PhoodX, pairs a countertop scale
  and camera system with a waste-analytics dashboard to automatically identify, weigh, and categorize
  discarded food in commercial kitchens, grocery prepared-foods operations, and food-service venues.
  The platform reports product-level margins, recommends demand-based production volumes, and helps
  operators cut food waste by up to 50 percent, reduce kitchen labor, and lower food-inventory costs.
  Phood also offers Phood Lab, custom digital solutions built by its food technologists. The company
  is backed by Techstars. Phood publishes no public API or developer program at this time.
